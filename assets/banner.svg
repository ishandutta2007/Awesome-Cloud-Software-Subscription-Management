<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Dynamic / Animated Background Elements (Pills & Graphs behind text) -->
  <g opacity="0.25">
    <!-- Pulse Ring 1 -->
    <circle cx="200" cy="200" r="140" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="120;160;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Pulse Ring 2 -->
    <circle cx="1000" cy="200" r="160" fill="none" stroke="#c084fc" stroke-width="2">
      <animate attributeName="r" values="140;180;140" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating Graphic Wave -->
    <path d="M0 320 Q 300 260, 600 310 T 1200 270 L 1200 400 L 0 400 Z" fill="#818cf8" opacity="0.15">
      <animate attributeName="d" values="M0 320 Q 300 260, 600 310 T 1200 270 L 1200 400 L 0 400 Z; M0 300 Q 300 340, 600 280 T 1200 320 L 1200 400 L 0 400 Z; M0 320 Q 300 260, 600 310 T 1200 270 L 1200 400 L 0 400 Z" dur="10s" repeatCount="indefinite"/>
    </path>

    <!-- Background Tech Grid Lines -->
    <line x1="100" y1="0" x2="100" y2="400" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#c084fc" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="#c084fc" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

  <!-- Central Dark Backdrop Card for Crisp Text Contrast -->
  <rect x="120" y="60" width="960" height="280" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" backdrop-filter="blur(10px)"/>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Icon / Badge Pill -->
    <g transform="translate(600, 115)">
      <rect x="-140" y="-22" width="280" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="2" fill="#38bdf8" font-size="14" font-weight="600" letter-spacing="1.5">SAAS &amp; CLOUD ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="195" fill="url(#titleGrad)" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Cloud Software Subscription Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="245" fill="#e2e8f0" font-size="18" font-weight="400" opacity="0.95">
      Curated Commercial SaaS Platforms, License Optimization &amp; Self-Hosted Open-Source Billing
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(600, 290)" font-size="13" font-weight="500">
      <rect x="-260" y="-14" width="150" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)"/>
      <text x="-185" y="4" fill="#94a3b8">📊 Spend Analytics</text>

      <rect x="-90" y="-14" width="180" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)"/>
      <text x="0" y="4" fill="#94a3b8">⚡ Shadow IT Discovery</text>

      <rect x="100" y="-14" width="160" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)"/>
      <text x="180" y="4" fill="#94a3b8">🔓 Open-Source Tools</text>
    </g>
  </g>
</svg>
